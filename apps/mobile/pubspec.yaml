name: nova_mobile
description: "NOVA - AI Companion by Leadup Technologies"
publish_to: 'none'

version: 1.0.0+1

environment:
 sdk: ^3.13.2

dependencies:
 flutter:
  sdk: flutter
 cupertino_icons: ^1.0.8
 flutter_riverpod: ^3.4.3
 riverpod_annotation: ^4.0.7
 go_router: ^18.0.1
 freezed_annotation: ^3.1.0
 json_annotation: ^4.12.0
 dio: ^5.11.1
 drift: ^2.34.4
 sqlite3_flutter_libs: ^0.6.0+eol
 path_provider: ^2.1.6
 path: ^1.9.1
 flutter_secure_storage: ^11.0.0
 rive: ^0.14.11
 audio_session: ^0.2.4
 just_audio: ^0.10.6
 permission_handler: ^13.0.2
 sensors_plus: ^6.1.0
 local_auth: ^3.0.2
 flutter_local_notifications: ^22.3.0
 uuid: ^4.6.0
 intl: ^0.20.3
 equatable: ^2.1.0
 package_info_plus: ^10.2.1
 connectivity_plus: ^7.3.1
 shared_preferences: ^2.5.5
 # Voice streaming transport. Previously only a transitive dependency, but the app now
 # uses it directly for the reconnecting voice WebSocket client.
 web_socket_channel: ^3.0.3
 firebase_core: ^4.15.0
 firebase_crashlytics: ^5.4.0
 firebase_analytics: ^12.6.0

dev_dependencies:
 flutter_test:
  sdk: flutter
 flutter_lints: ^6.0.0
 build_runner: ^2.16.1
 riverpod_generator: ^4.0.9
 freezed: ^4.0.1
 json_serializable: ^6.14.1
 drift_dev: ^2.34.6
 mocktail: ^1.0.4

flutter:
 uses-material-design: true
 assets:
 - assets/images/
 fonts:
 # Fonts required by the OpenDesign brand spec (assets/brand-spec.md "Font
 # stacks"). All four ship as variable fonts, so the same asset is declared once
 # per weight; NovaTheme additionally pins exact instances with fontVariations.
 - family: PlusJakartaSans
   fonts:
   - asset: assets/fonts/PlusJakartaSans.ttf
     weight: 300
   - asset: assets/fonts/PlusJakartaSans.ttf
     weight: 400
   - asset: assets/fonts/PlusJakartaSans.ttf
     weight: 500
   - asset: assets/fonts/PlusJakartaSans.ttf
     weight: 600
   - asset: assets/fonts/PlusJakartaSans.ttf
     weight: 700
   - asset: assets/fonts/PlusJakartaSans.ttf
     weight: 800
 - family: Inter
   fonts:
   - asset: assets/fonts/Inter.ttf
     weight: 300
   - asset: assets/fonts/Inter.ttf
     weight: 400
   - asset: assets/fonts/Inter.ttf
     weight: 500
   - asset: assets/fonts/Inter.ttf
     weight: 600
   - asset: assets/fonts/Inter.ttf
     weight: 700
 - family: JetBrainsMono
   fonts:
   - asset: assets/fonts/JetBrainsMono.ttf
     weight: 400
   - asset: assets/fonts/JetBrainsMono.ttf
     weight: 500
 - family: NotoSansTamil
   fonts:
   - asset: assets/fonts/NotoSansTamil.ttf
     weight: 400
   - asset: assets/fonts/NotoSansTamil.ttf
     weight: 500
   - asset: assets/fonts/NotoSansTamil.ttf
     weight: 600
   - asset: assets/fonts/NotoSansTamil.ttf
     weight: 700

flutter_launcher_icons:
 android: true
 ios: true
 # assets/images/ holds only a README, so this previously pointed at a file that
 # does not exist; the real icon is assets/icon.png.
 image_path: assets/icon.png
 min_sdk_android: 24
