name: nova_mobile
description: "NOVA - AI Companion by Leadup Technologies"
publish_to: 'none'

version: 1.0.0+1

environment:
 sdk: ^3.13.2

dependencies:
 flutter:
  sdk: flutter
 flutter_riverpod: ^3.4.3
 go_router: ^18.0.1
 dio: ^5.11.1
 path_provider: ^2.1.6
 flutter_secure_storage: ^11.0.0
 audio_session: ^0.2.4
 just_audio: ^0.10.6
 # Microphone capture for the Converse voice loop (tap the mic, speak, get a
 # transcript). Spoken replies still play through just_audio above.
 record: ^7.1.1
 # On-device text-to-speech. The fallback voice when the cloud TTS provider is
 # unavailable: it needs no key, no account and no credits, and Android/iOS ship
 # voices for the languages NOVA supports.
 flutter_tts: ^4.2.5
 permission_handler: ^13.0.2
 flutter_local_notifications: ^22.3.0
 timezone: ^0.11.1
 connectivity_plus: ^7.3.1
 shared_preferences: ^2.5.5
 # Voice streaming transport. Previously only a transitive dependency, but the app now
 # uses it directly for the reconnecting voice WebSocket client.
 web_socket_channel: ^3.0.3
 firebase_core: ^4.15.0
 firebase_crashlytics: ^5.4.0
 firebase_analytics: ^12.6.0
 # Device model and OS version, for the operator's device inventory.
 #
 # These were deliberately omitted while the app had no way to read them, and the console
 # rendered them as "not reported" — which was honest, but left the "Android versions" tile
 # populated only by synthetic verification rows. A device inventory whose model column is
 # empty cannot answer "which handsets are in the field", which is what it exists for.
 # `device_info_plus` reads `android.os.Build.MODEL` / `Build.VERSION.RELEASE` (and the iOS
 # equivalents) with no permission required.
 device_info_plus: ^13.2.0
 firebase_messaging: ^16.2.0
 firebase_auth: ^6.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
 uses-material-design: true
 assets:
 - assets/images/
 fonts:
 # Fonts required by the OpenDesign brand spec (assets/brand-spec.md "Font
 # stacks"). All four ship as variable fonts, so the same asset is declared once
 # per weight; NovaTheme additionally pins exact instances with fontVariations.
 - family: PlusJakartaSans
   fonts:
   - asset: assets/fonts/PlusJakartaSans.ttf
     weight: 300
   - asset: assets/fonts/PlusJakartaSans.ttf
     weight: 400
   - asset: assets/fonts/PlusJakartaSans.ttf
     weight: 500
   - asset: assets/fonts/PlusJakartaSans.ttf
     weight: 600
   - asset: assets/fonts/PlusJakartaSans.ttf
     weight: 700
   - asset: assets/fonts/PlusJakartaSans.ttf
     weight: 800
 - family: Inter
   fonts:
   - asset: assets/fonts/Inter.ttf
     weight: 300
   - asset: assets/fonts/Inter.ttf
     weight: 400
   - asset: assets/fonts/Inter.ttf
     weight: 500
   - asset: assets/fonts/Inter.ttf
     weight: 600
   - asset: assets/fonts/Inter.ttf
     weight: 700
 - family: JetBrainsMono
   fonts:
   - asset: assets/fonts/JetBrainsMono.ttf
     weight: 400
   - asset: assets/fonts/JetBrainsMono.ttf
     weight: 500
 - family: NotoSansTamil
   fonts:
   - asset: assets/fonts/NotoSansTamil.ttf
     weight: 400
   - asset: assets/fonts/NotoSansTamil.ttf
     weight: 500
   - asset: assets/fonts/NotoSansTamil.ttf
     weight: 600
   - asset: assets/fonts/NotoSansTamil.ttf
     weight: 700

flutter_launcher_icons:
 android: true
 ios: true
 # assets/images/ holds only a README, so this previously pointed at a file that
 # does not exist; the real icon is assets/icon.png.
 image_path: assets/icon.png
 min_sdk_android: 24
