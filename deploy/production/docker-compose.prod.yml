# NOVA — Production docker-compose for nova.leadup.in
# Build context is the repo root.
# Image names are pre-built on the host with ./deploy.sh before bringing this up.

services:
  # ─── Infrastructure ─────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../packages/database/drizzle/0000_regular_colossus.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - postgres_backups:/backups
    shm_size: 1gb
    networks:
      - nova-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: nova-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - 60 1000
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    networks:
      - nova-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nova-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - nova-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Application services ──────────────────────────────────────────────
  api:
    image: nova-api:${IMAGE_TAG:-prod}
    container_name: nova-api
    restart: unless-stopped
    env_file: [../../.env.production]
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Build identity for /metrics (nova_build_info). Without it the gauge reads
      # "unknown" and "is this deploy actually live?" needs a grep inside the
      # running container. The deploy sets it to the commit being shipped.
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    networks: [nova-network]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  auth:
    image: nova-auth:${IMAGE_TAG:-prod}
    container_name: nova-auth
    restart: unless-stopped
    env_file: [../../.env.production]
    environment:
      NODE_ENV: production
      PORT: "3003"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [nova-network]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  realtime-gateway:
    image: nova-realtime-gateway:${IMAGE_TAG:-prod}
    container_name: nova-realtime
    restart: unless-stopped
    env_file: [../../.env.production]
    environment:
      NODE_ENV: production
      PORT: "3002"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis: { condition: service_healthy }
    networks: [nova-network]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  notification-service:
    image: nova-notification-service:${IMAGE_TAG:-prod}
    container_name: nova-notifications
    restart: unless-stopped
    env_file: [../../.env.production]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    networks: [nova-network]

  integration-service:
    image: nova-integration-service:${IMAGE_TAG:-prod}
    container_name: nova-integration
    restart: unless-stopped
    env_file: [../../.env.production]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [nova-network]

  admin:
    image: nova-admin:${IMAGE_TAG:-prod}
    container_name: nova-admin
    restart: unless-stopped
    env_file: [../../.env.production]
    environment:
      NODE_ENV: production
      PORT: "3004"
      API_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }
    networks: [nova-network]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/api/health', r => process.exit(r.statusCode < 500 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: nova-worker:${IMAGE_TAG:-prod}
    container_name: nova-worker
    restart: unless-stopped
    env_file: [../../.env.production]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    networks: [nova-network]

  voice-api:
    image: nova-voice-api:${IMAGE_TAG:-prod}
    container_name: nova-voice-api
    restart: unless-stopped
    env_file: [../../.env.production]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [nova-network]

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
  minio_data:

networks:
  nova-network:
    driver: bridge
