user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_user_agent" '
                  'rt=$request_time';

  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  limit_req_zone $binary_remote_addr zone=api:10m   rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m  rate=5r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;

  upstream nova_api      { server 127.0.0.1:3001; keepalive 32; }
  upstream nova_auth     { server 127.0.0.1:3003; keepalive 16; }
  upstream nova_realtime { server 127.0.0.1:3002; keepalive 16; }
  upstream nova_admin    { server 127.0.0.1:3004; keepalive 8; }

  # HTTP → HTTPS (with ACME exception)
  server {
    listen 80;
    listen [::]:80;
    server_name nova.leadup.in admin.nova.leadup.in;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/letsencrypt;
    }
    location / { return 301 https://$host$request_uri; }
  }

  # nova.leadup.in — main API + WebSocket
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nova.leadup.in;

    ssl_certificate     /etc/letsencrypt/live/nova.leadup.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nova.leadup.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50M;

    location = /healthz { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }

    location /api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://nova_auth/login;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Only the direct client address: $proxy_add_x_forwarded_for would keep client-injected (spoofable) XFF entries.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://nova_auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://nova_api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_read_timeout 30s;
    }

    # Realtime gateway (WebSocket + voice)
    location /ws/ {
      proxy_pass http://nova_realtime/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }
  }

  # admin.nova.leadup.in — admin panel
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.nova.leadup.in;

    ssl_certificate     /etc/letsencrypt/live/nova.leadup.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nova.leadup.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;

    location / {
      proxy_pass http://nova_admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
