# NOVA — HTTP front door (pre-TLS bootstrap).
#
# Deploy to: /etc/nginx/sites-available/nova.leadup.in
# Enable:    ln -sf /etc/nginx/sites-available/nova.leadup.in /etc/nginx/sites-enabled/
#
# This is the FIRST step. It serves the Let's Encrypt HTTP-01 challenge and proxies to
# the containers, which is exactly what certbot needs in order to validate the domain:
#
#   certbot --nginx -d nova.leadup.in -d admin.nova.leadup.in
#
# certbot then rewrites this file in place, adding the `listen 443 ssl` server blocks and
# the HTTP→HTTPS redirect. `deploy/nginx/nova.conf` is the fully-TLS version for
# reference / manual install if you would rather not let certbot edit nginx config.
#
# `default_server` is deliberate: it makes the stack reachable by IP
# (http://<server-ip>/api/...) before DNS points here.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name nova.leadup.in admin.nova.leadup.in _;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 50M;

    # Dedicated admin API — services/admin (nova-admin) on 3004.
    # Must come BEFORE /api/ so it is not swallowed by the main API's prefix.
    # Note the two distinct admin surfaces:
    #   /api/admin/*     -> the standalone admin service on 3004
    #   /api/v1/admin/*  -> the main API's own admin routes on 3001
    location /api/admin/ {
        proxy_pass http://127.0.0.1:3004/api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API — nova-api on 3001
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Realtime (socket.io) — nova-realtime on 3002
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Health probes — nova-admin (:3004) exposes /health/live and /health/ready at
    # the origin root. Declared explicitly because `location /` now belongs to the
    # admin console, which would otherwise answer these with a login redirect.
    location /health/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin console — nova-admin-ui (apps/admin, Next.js) on 3005.
    #
    # Note the two distinct admin surfaces:
    #   nova-admin-ui (:3005, this block)  -> the HTML panel at /
    #   nova-admin    (:3004, /api/admin/) -> the JSON admin API
    # services/admin is API-only and has no `/` route, so it must not serve `/`.
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
