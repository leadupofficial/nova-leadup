# NOVA — Nginx Configuration
# Deploy to: /etc/nginx/sites-available/nova.leadup.in
# Enable: sudo ln -sf /etc/nginx/sites-available/nova.leadup.in /etc/nginx/sites-enabled/

# ─── HTTP → HTTPS redirect ──────────────────────────────────────
server {
 listen 80;
 server_name nova.leadup.in admin.nova.leadup.in;

 # Let's Encrypt ACME challenge
 location /.well-known/acme-challenge/ {
 root /var/www/certbot;
 }

 location / {
 return 301 https://$server_name$request_uri;
 }
}

# ─── HTTPS — Main API + Web ─────────────────────────────────────
server {
 listen 443 ssl http2;
 server_name nova.leadup.in;

 ssl_certificate /etc/letsencrypt/live/nova.leadup.in/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/nova.leadup.in/privkey.pem;
 ssl_trusted_certificate /etc/letsencrypt/live/nova.leadup.in/chain.pem;

 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
 ssl_prefer_server_ciphers off;
 ssl_session_cache shared:SSL:10m;
 ssl_session_timeout 10m;

 # Security headers
 add_header X-Frame-Options "SAMEORIGIN" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-XSS-Protection "1; mode=block" always;
 add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

 # ── Standalone admin API ──────────────────────────────────────
 # Must precede /api/ so it is not swallowed by the main API prefix.
 # Note the two distinct admin surfaces:
 #   /api/admin/*    -> nova-admin    (services/admin)      on 3004
 #   /api/v1/admin/* -> nova-api      (services/api routes) on 3001
 location /api/admin/ {
 proxy_pass http://127.0.0.1:3004/api/admin/;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_read_timeout 60s;
 }

 # ── API routes ────────────────────────────────────────────────
 location /api/ {
 proxy_pass http://127.0.0.1:3001/api/;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 client_max_body_size 50M;
 proxy_read_timeout 60s;
 proxy_connect_timeout 10s;
 }

 # ── WebSocket (Socket.IO for real-time) ────────────────────────
 location /socket.io/ {
 # nova-realtime (realtime-gateway) listens on 3002, not on the API's 3001.
 proxy_pass http://127.0.0.1:3002/socket.io/;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_read_timeout 300s;
 }

 # ── Health probes ─────────────────────────────────────────────
 # nova-admin (:3004) exposes /health/live and /health/ready at the origin root.
 # Declared explicitly because `location /` belongs to the admin console.
 location /health/ {
 proxy_pass http://127.0.0.1:3004;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 }

 # ── Web app ───────────────────────────────────────────────────
 location / {
 # nova-admin-ui (apps/admin, Next.js) listens on 3005. nova-admin (:3004) is
 # the API-only admin service and is reached via /api/admin/ below.
 proxy_pass http://127.0.0.1:3005;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 }

 # ── Static assets caching ──────────────────────────────────────
 location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
 proxy_pass http://127.0.0.1:3005;
 expires 1y;
 add_header Cache-Control "public, immutable";
 }
}

# ─── Admin subdomain ─────────────────────────────────────────────
server {
 listen 443 ssl http2;
 server_name admin.nova.leadup.in;

 ssl_certificate /etc/letsencrypt/live/nova.leadup.in/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/nova.leadup.in/privkey.pem;

 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
 ssl_prefer_server_ciphers off;

 add_header X-Frame-Options "SAMEORIGIN" always;
 add_header X-Content-Type-Options "nosniff" always;

 location / {
 # The admin console is nova-admin-ui on 3005; 3007 is the integration service.
 proxy_pass http://127.0.0.1:3005;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 }
}

# ─── ACME challenge for renewal ─────────────────────────────────
server {
 listen 80;
 server_name nova.leadup.in admin.nova.leadup.in;
 location /.well-known/acme-challenge/ {
 root /var/www/certbot;
 }
}
