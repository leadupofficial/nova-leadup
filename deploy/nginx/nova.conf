# NOVA — Nginx TLS configuration (post-certificate).
#
# Deploy to: /etc/nginx/sites-available/nova.leadup.in
# Enable:    ln -sf /etc/nginx/sites-available/nova.leadup.in /etc/nginx/sites-enabled/
#
# Issue the certificate first (HTTP-01 via the webroot that the :80 block below
# serves). `certonly` rather than `--nginx` so certbot does not rewrite this file:
#
#   certbot certonly --webroot -w /var/www/certbot \
#     -d nova.leadup.in -d admin.nova.leadup.in -d api.nova.leadup.in
#
# Then: nginx -t && systemctl reload nginx
#
# NOTE: this is a SINGLE :443 server block for both hostnames, deliberately. An
# earlier revision had two divergent blocks (apex + admin subdomain) and the
# subdomain block was missing /api/, /api/admin/, /socket.io/ and /health/, so
# https://admin.nova.leadup.in/api/... silently fell through to the console and
# 404'd. Keeping one block makes that divergence impossible.

# ─── HTTP: ACME challenge + redirect ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name nova.leadup.in admin.nova.leadup.in api.nova.leadup.in _;

    # Let's Encrypt HTTP-01 challenge, and renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # $host, not $server_name: $server_name expands to the FIRST name in this
    # block, so a request to admin.nova.leadup.in would be redirected to the
    # apex domain and lose the subdomain.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: API, admin console, realtime ─────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nova.leadup.in admin.nova.leadup.in api.nova.leadup.in;

    ssl_certificate /etc/letsencrypt/live/nova.leadup.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nova.leadup.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nova.leadup.in/chain.pem;

    # TLS 1.2+ only; nginx's default cipher list is used deliberately rather than
    # a hand-picked pair of suites.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50M;

    # ── Health probes ─────────────────────────────────────────────
    # nova-admin (:3004) exposes /health/live and /health/ready at the origin
    # root. Declared explicitly because `location /` belongs to the console.
    location /health/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Standalone admin API ──────────────────────────────────────
    # Must precede /api/ so it is not swallowed by the main API prefix.
    # Two distinct admin surfaces:
    #   /api/admin/*    -> nova-admin    (services/admin)      on 3004
    #   /api/v1/admin/* -> nova-api      (services/api routes) on 3001
    location /api/admin/ {
        proxy_pass http://127.0.0.1:3004/api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Mobile liveness ───────────────────────────────────────────
    # apps/mobile polls this unauthenticated; services/api serves it on 3001.
    # Declared explicitly, otherwise `location /` sends it to the console, which
    # redirects to /login and the client reads that 200 HTML page as "Connected".
    location = /healthz {
        proxy_pass http://127.0.0.1:3001/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Main API ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Realtime (socket.io) ──────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Admin console (apps/admin, Next.js) ───────────────────────
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
