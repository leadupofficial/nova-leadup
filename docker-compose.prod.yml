 - no-new-privileges:true
 read_only: true
 tmpfs:
 - /tmp

 # Workflow Engine
 workflow-engine:
 image: nova-workflow-engine:latest
 container_name: nova-workflow
 restart: unless-stopped
 environment:
 NODE_ENV: production
 DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
 REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 networks:
 - nova-network
 security_opt:
 - no-new-privileges:true
 read_only: true
 tmpfs:
 - /tmp

 # Admin Console — administrative interface
 admin:
 image: nova-web:latest
 container_name: nova-admin
 restart: unless-stopped
 ports:
 - "127.0.0.1:3004:3004"
 environment:
 NODE_ENV: production
 PORT: 3004
 DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
 REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
 JWT_SECRET: ${JWT_SECRET}
 CORS_ORIGIN: ${CORS_ORIGIN}
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 networks:
 - nova-network
 security_opt:
 - no-new-privileges:true
 read_only: true
 tmpfs:
 - /tmp
 healthcheck:
 test: ["CMD", "curl", "-f", "http://localhost:3004/health/live"]
 interval: 15s
 timeout: 5s
 retries: 3
 start_period: 10s

volumes:
 postgres_data:
 driver: local
 redis_data:
 driver: local
 minio_data:
 driver: local

networks:
 nova-network:
 driver: bridge
 ipam:
 config:
 - subnet: 172.28.0.0/16
