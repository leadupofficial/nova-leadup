services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nova}
      POSTGRES_INITDB_ARGS: -E UTF8 --locale=en_US.UTF-8
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    - ./infrastructure/backups:/backups
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nova}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
    - nova-network
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp
    - /var/run/postgresql
  redis:
    image: redis:7-alpine
    container_name: nova-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000 --appendonly yes
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
    - nova-network
    security_opt:
    - no-new-privileges:true
  minio:
    image: minio/minio:latest
    container_name: nova-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
    - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - nova-network
  api:
    image: nova-api:prod
    container_name: nova-api
    restart: unless-stopped
    ports:
    - 127.0.0.1:3001:3001
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-nova-assets}
      JWT_SECRET: ${JWT_SECRET}
      # services/api refuses to boot in production without a refresh secret
      # (config.ts getEnvConfig throws). It was missing here entirely.
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
    - nova-network
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp
    healthcheck:
      # `curl` does not exist in the node:22-alpine runtime image, so the previous
      # `curl -f` probe failed with `exec: "curl": executable file not found` and the
      # container reported unhealthy while the API was serving normally. Node 22 has a
      # global fetch, so use that rather than adding curl to every image.
      test:
      - CMD
      - node
      - -e
      - "fetch('http://localhost:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  auth:
    image: nova-auth:latest
    container_name: nova-auth
    restart: unless-stopped
    ports:
    - 127.0.0.1:3003:3003
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      # services/auth/src/env.ts validates JWT_REFRESH_SECRET, but this file only passed
      # REFRESH_TOKEN_SECRET — so its validator rejected the environment and the container
      # sat unhealthy. Both names are now fed from one value.
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      REFRESH_TOKEN_SECRET: ${JWT_REFRESH_SECRET}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY}
      API_KEY_SECRET: ${API_KEY_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - nova-network
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - "fetch('http://localhost:3003/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  realtime-gateway:
    image: nova-realtime-gateway:latest
    container_name: nova-realtime
    restart: unless-stopped
    ports:
    - 127.0.0.1:3002:3002
    environment:
      NODE_ENV: production
      PORT: 3002
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    networks:
    - nova-network
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp
  notification-service:
    image: nova-notification-service:latest
    container_name: nova-notifications
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # services/notification-service validates JWT_SECRET and was never given one, so it
      # fell back to its own default — 'fallback-secret-change-me', which is 25 characters
      # and therefore fails its own min(32) rule. The container crash-looped with
      # "Invalid environment configuration."
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-nova-assets}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
    - nova-network
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp
  integration-service:
    image: nova-integration-service:latest
    container_name: nova-integration
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - nova-network
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp
  workflow-engine:
    image: nova-workflow-engine:latest
    container_name: nova-workflow
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - nova-network
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp
  admin:
    image: nova-web:latest
    container_name: nova-admin
    restart: unless-stopped
    ports:
    - 127.0.0.1:3004:3004
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - nova-network
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - "fetch('http://localhost:3004/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  # Next.js admin console (apps/admin). Serves the HTML panel that nginx exposes
  # at `/`. The `admin` service above stays as the /api/admin/* JSON API — they
  # are two different things with confusingly similar names.
  admin-ui:
    image: nova-admin-ui:latest
    container_name: nova-admin-ui
    restart: unless-stopped
    ports:
    - 127.0.0.1:3005:3005
    environment:
      NODE_ENV: production
      PORT: 3005
      HOSTNAME: 0.0.0.0
      # Inlined into the client bundle at image build time; must match the
      # NEXT_PUBLIC_API_BASE build arg in apps/admin/Dockerfile.
      NEXT_PUBLIC_API_BASE: https://nova.leadup.in/api/v1
      API_INTERNAL_URL: http://api:3001/api/v1
      API_ORIGIN_URL: http://admin:3004
    depends_on:
    - api
    - admin
    networks:
    - nova-network
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - "fetch('http://localhost:3005/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
networks:
  nova-network:
    driver: bridge
    ipam:
      config:
      - subnet: 172.28.0.0/16
