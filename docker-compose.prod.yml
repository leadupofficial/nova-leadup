 container_name: nova-notifications
 restart: unless-stopped
 environment:
 NODE_ENV: production
 DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
 REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
 S3_ENDPOINT: http://minio:9000
 S3_ACCESS_KEY: ${S3_ACCESS_KEY}
 S3_SECRET_KEY: ${S3_SECRET_KEY}
 S3_BUCKET: ${S3_BUCKET:-nova-assets}
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 minio:
 condition: service_healthy
 networks:
 - nova-network
 security_opt:
 - no-new-privileges:true
 read_only: true
 tmpfs:
 - /tmp

 # Integration Service
 integration-service:
 image: nova-integration-service:latest
 container_name: nova-integration
 restart: unless-stopped
 environment:
 NODE_ENV: production
 DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
 REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
 depends_on:
