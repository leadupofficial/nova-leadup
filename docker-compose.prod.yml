# NOVA Production Compose — updated 2025-09-10
# Uses pre-built images already present on the server (nova-api:prod, nova-auth:latest, etc.)
# so it can boot without a Node.js toolchain on the host.

services:
 # PostgreSQL with pgvector for vector search
 postgres:
 image: pgvector/pgvector:pg16
 container_name: nova-postgres
 restart: unless-stopped
 environment:
 POSTGRES_USER: ${POSTGRES_USER:-postgres}
 POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
 POSTGRES_DB: ${POSTGRES_DB:-nova}
 POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
 volumes:
 - postgres_data:/var/lib/postgresql/data
 - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
 - ./infrastructure/backups:/backups
 healthcheck:
 test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nova}"]
 interval: 10s
 timeout: 5s
 retries: 5
 start_period: 30s
 networks:
 - nova-network
 security_opt:
 - no-new-privileges:true
 read_only: true
 tmpfs:
 - /tmp
 - /var/run/postgresql

 # Redis for caching, rate limiting, session store
 redis:
 image: redis:7-alpine
 container_name: nova-redis
 restart: unless-stopped
 command: ["sh","-c","redis-server --requirepass $REDIS_PASSWORD --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000 --appendonly yes"]
 volumes:
 - redis_data:/data
 healthcheck:
 test: ["CMD", "redis-cli", "ping"]
 interval: 10s
 timeout: 5s
 retries: 5
 start_period: 5s
 networks:
 - nova-network
 security_opt:
 - no-new-privileges:true

 # MinIO for S3-compatible object storage
 minio:
 image: minio/minio:latest
 container_name: nova-minio
 restart: unless-stopped
 environment:
 MINIO_ROOT_USER: ${S3_ACCESS_KEY}
 MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
 volumes:
 - minio_data:/data
 command: server /data --console-address ":9001"
 healthcheck:
 test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
 interval: 10s
 timeout: 5s
 retries: 5
 start_period: 10s
 networks:
 - nova-network

 # API Service — REST/GraphQL gateway
 api:
 image: nova-api:prod
 container_name: nova-api
 restart: unless-stopped
 ports:
 - "127.0.0.1:3001:3001"
 environment:
 NODE_ENV: production
 PORT: 3001
 DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
 REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
 S3_ENDPOINT: http://minio:9000
 S3_ACCESS_KEY: ${S3_ACCESS_KEY}
 S3_SECRET_KEY: ${S3_SECRET_KEY}
 S3_BUCKET: ${S3_BUCKET:-nova-assets}
 JWT_SECRET: ${JWT_SECRET}
 JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
 CORS_ORIGIN: ${CORS_ORIGIN}
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 minio:
 condition: service_healthy
 networks:
 - nova-network
 security_opt:
 - no-new-privileges:true
 read_only: true
 tmpfs:
 - /tmp
 healthcheck:
 test: ["CMD", "curl", "-f", "http://localhost:3001/health/live"]
 interval: 15s
 timeout: 5s
 retries: 3
 start_period: 10s

 # Auth Service — authentication and RBAC
 auth:
 image: nova-auth:latest
 container_name: nova-auth
 restart: unless-stopped
 ports:
 - "127.0.0.1:3003:3003"
 environment:
 NODE_ENV: production
 PORT: 3003
 DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
 REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
 JWT_SECRET: ${JWT_SECRET}
 REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
 AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY}
 API_KEY_SECRET: ${API_KEY_SECRET}
 CORS_ORIGIN: ${CORS_ORIGIN}
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 networks:
 - nova-network
 security_opt:
 - no-new-privileges:true
 read_only: true
 tmpfs:
 - /tmp
 healthcheck:
 test: ["CMD", "curl", "-f", "http://localhost:3003/health/live"]
 interval: 15s
 timeout: 5s
 retries: 3
 start_period: 10s

 # Realtime Gateway
 realtime-gateway:
 image: nova-realtime-gateway:latest
 container_name: nova-realtime
 restart: unless-stopped
 ports:
 - "127.0.0.1:3002:3002"
 environment:
 NODE_ENV: production
 PORT: 3002
 REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
 JWT_SECRET: ${JWT_SECRET}
 depends_on:
 redis:
 condition: service_healthy
 networks:
 - nova-network
 security_opt:
 - no-new-privileges:true
 read_only: true
 tmpfs:
 - /tmp

 # Notification Service
 notification-service:
