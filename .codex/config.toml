approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS = "1"
CLAUDE_FLOW_V3_ENABLED = "true"
CLAUDE_FLOW_HOOKS_ENABLED = "true"

[mcp_servers.claude-flow]
command = "npx"
args = [
    "-y",
    "ruflo@latest",
    "mcp",
    "start",
]

[mcp_servers.claude-flow.env]
npm_config_update_notifier = "false"
CLAUDE_FLOW_MODE = "v3"
CLAUDE_FLOW_HOOKS_ENABLED = "true"
CLAUDE_FLOW_TOPOLOGY = "hierarchical-mesh"
CLAUDE_FLOW_MAX_AGENTS = "15"
CLAUDE_FLOW_MEMORY_BACKEND = "hybrid"

[mcp_servers.apify]
url = "https://mcp.apify.com/"

[mcp_servers.apify.http_headers]
Authorization = "Bearer"

[mcp_servers.chrome-devtools]
command = "npx"
args = [
    "--registry",
    "https://registry.npmjs.org",
    "chrome-devtools-mcp@1.1.0",
]

[mcp_servers.codegraph]
command = "codegraph"
args = [
    "serve",
    "--mcp",
]

[mcp_servers.context7]
command = "npx"
args = [
    "@upstash/context7-mcp@1.0.31",
    "-e",
    "CONTEXT7_API_KEY=${CONTEXT7_API_KEY}",
]

[mcp_servers.contextstream]
command = "npx"
args = ["@contextstream/mcp-server@0.3.63"]

[mcp_servers.desktop-commander]
command = "npx"
args = [
    "--registry",
    "https://registry.npmjs.org",
    "@wonderwhy-er/desktop-commander@0.2.50",
]

[mcp_servers.docker-gateway]
command = "docker"
args = [
    "mcp",
    "gateway",
    "run",
]

[mcp_servers.elasticsearch]
command = "docker"
args = [
    "run",
    "-i",
    "--rm",
    "-e",
    "ES_URL",
    "-e",
    "ES_API_KEY",
    "docker.elastic.co/mcp/elasticsearch:latest",
]

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.firecrawl]
command = "npx"
args = [
    "-y",
    "firecrawl-mcp@latest",
    "-e",
    "FIRECRAWL_API_KEY=fc-1ed55bb59db6451bae19c5e418954d94",
]

[mcp_servers.github]
command = "docker"
args = [
    "run",
    "-i",
    "--rm",
    "-e",
    "GITHUB_PERSONAL_ACCESS_TOKEN=",
    "ghcr.io/github/github-mcp-server:0.30.3",
]

[mcp_servers.markitdown]
command = "uvx"
args = ["markitdown-mcp@0.0.1a4"]

[mcp_servers.netdata]
url = "https://app.netdata.cloud/api/v1/mcp"

[mcp_servers.netdata.http_headers]
Authorization = "Bearer"

[mcp_servers.nuget]
command = "dnx"
args = [
    "NuGet.Mcp.Server@1.4.3",
    "--yes",
    "--source",
    "https://api.nuget.org/v3/index.json",
]

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]
