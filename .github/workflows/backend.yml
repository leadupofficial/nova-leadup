name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'services/**'

jobs:
  lint-and-build:
    name: Lint & Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api
          - auth
          - notification-service
          - voice-api
          - realtime-gateway
          - agent-orchestrator
          - integration-service
          - workflow-engine
          - workers
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    # Test suites run the API's boot-time env validation; the repo's .env
    # files are gitignored, so without these obviously-dummy values every
    # suite aborts at collection with "JWT_SECRET must be set to a strong
    # value". Same set as ci.yml's test job.
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://test:test@localhost:5432/test
      JWT_SECRET: ci-test-jwt-secret-not-a-real-key-0123456789
      JWT_REFRESH_TOKEN_SECRET: ci-test-refresh-token-not-a-real-key-0123456789
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-a-real-key-0123456789
      PORT: '3001'
      ANTHROPIC_API_KEY: ci-test-not-a-real-key
      BROCODE_API_KEY: ci-test-not-a-real-key
      SARVAM_API_KEY: ci-test-not-a-real-key
      DEEPGRAM_API_KEY: ci-test-not-a-real-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint ${{ matrix.service }}
        run: pnpm run lint

      - name: Build ${{ matrix.service }}
        # `foo...` = the package plus its workspace dependencies. A bare
        # `pnpm run build` here compiles the service against @nova/* packages
        # whose dist/ types do not exist on a fresh CI checkout, which is how
        # integration-service failed with TS2307 Cannot find module '@nova/auth'.
        run: pnpm --filter "@nova/${{ matrix.service }}..." run build

      - name: Run tests — ${{ matrix.service }}
        run: pnpm run test
