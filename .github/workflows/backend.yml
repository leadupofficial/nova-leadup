name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'services/**'

jobs:
  lint-and-build:
    name: Lint & Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api
          - auth
          - notification-service
          - voice-api
          - realtime-gateway
          - agent-orchestrator
          - integration-service
          - workflow-engine
          - workers
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint ${{ matrix.service }}
        run: pnpm run lint

      - name: Build ${{ matrix.service }}
        run: pnpm run build

      - name: Run tests — ${{ matrix.service }}
        run: pnpm run test
