name: Mobile CI

# Flutter CI for apps/mobile. The previous revision was a dead Expo/React Native
# pipeline (`expo/expo-github-action`, `npx expo lint`, `expo run:android`, EAS
# builds) — apps/mobile is a Flutter app now, so none of those steps could ever run.
# Build artifacts are produced by `.github/workflows/build-apk.yml`; this workflow
# owns static analysis and tests only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The app's pubspec requires Dart ^3.13.2 (apps/mobile/pubspec.yaml), which is
      # newer than the Dart shipped with Flutter stable 3.29 — the beta channel
      # (Flutter 3.48 / Dart 3.14) satisfies it.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test
