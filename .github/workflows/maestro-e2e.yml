name: NOVA E2E Maestro Tests
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  workflow_dispatch: null
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_UNSTABLE_DISABLE_DEV_LAUNCHER_AUTOLINKING: '1'
      EXPO_USE_COMMUNITY_AUTOLINKING: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Accept Android SDK licenses
      run: 'mkdir -p /usr/local/lib/android/sdk/licenses

        echo -e "\nd243215ed4a640bd90b24baca47b2e39\n\n84831b9409646a918e30573bab4c9c91\n\nd56f5187479451eabf01fb78af6dfcb6"
        > /usr/local/lib/android/sdk/licenses/android-sdk-license

        echo -e "\n84831b9409646a918e30573bab4c9c91\n\nd56f5187479451eabf01fb78af6dfcb6"
        > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license

        echo "Accepted licenses"'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Create placeholder app assets
      working-directory: apps/mobile
      run: 'mkdir -p assets

        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
        | base64 -d > assets/icon.png

        cp assets/icon.png assets/adaptive-icon.png

        cp assets/icon.png assets/splash.png

        echo "Created valid placeholder assets"'
    - name: Fix Android build files
      working-directory: apps/mobile/android
      run: 'node ../../../.github/workflows/fix-android.js

        echo ''Applied fixes'''
    - name: Build release APK
      working-directory: apps/mobile/android
      run: 'chmod +x gradlew

        ./gradlew assembleRelease --no-daemon --warning-mode=none

        echo "Built APK"'
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: nova-android-apk
        path: apps/mobile/android/app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: error

 - name: Install Maestro
  run: curl -Ls https://get.maestro.mobile.dev | bash
  env:
  MAESTRO_CLI_NO_ANALYTICS: '1'
 
  - name: Start Android Emulator
  uses: reactivecircus/android-emulator-runner@v2
  with:
  api-level: 34
  target: google_apis
  arch: arm64-v8a
  profile: Pixel_10_Pro_XL
  boot-timeout: 600
  disable-animations: true
  disk-size: 4096
 
  - name: Install APK on Emulator
  run: adb install -r apps/mobile/android/app/build/outputs/apk/release/*.apk
 
  - name: Run Maestro Flows
  run: |
  export PATH="$HOME/.maestro/bin:$PATH"
  maestro test apps/mobile/.maestro/flows/01-home-screen.yaml
  maestro test apps/mobile/.maestro/flows/02-wake-word-voice-loop.yaml
  maestro test apps/mobile/.maestro/flows/03-text-input-fallback.yaml
  maestro test apps/mobile/.maestro/flows/04-reminder-creation.yaml
  maestro test apps/mobile/.maestro/flows/05-notification-classification.yaml
  maestro test apps/mobile/.maestro/flows/06-device-control.yaml
  maestro test apps/mobile/.maestro/flows/07-theme-consistency.yaml
  maestro test apps/mobile/.maestro/flows/08-full-companion-loop.yaml
  echo "All Maestro flows completed"
 
  - name: Upload Maestro Screenshots
  uses: actions/upload-artifact@v4
  with:
  name: maestro-screenshots
  path: apps/mobile/.maestro/screenshots/
  retention-days: 30
  if-no-files-found: ignore
 
 - name: Upload APK
 uses: actions/upload-artifact@v4
 with:
 name: nova-android-apk
 path: apps/mobile/android/app/build/outputs/apk/release/*.apk
 retention-days: 30
 if-no-files-found: error
