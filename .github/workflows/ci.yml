name: CI/CD Pipeline

# This workflow was stored with every key at one space of indentation, which YAML
# rejects ("expected <block end>, but found '-'") — the file could not be loaded by
# GitHub Actions at all. It also invoked root scripts that do not exist
# (`format:check`, `type-check`, `test:unit`, `security:audit`, `test:e2e`) and pinned
# `pnpm/action-setup` to version 11.24.0 while the repository's `packageManager` is
# pnpm 9.15.0. Both are corrected below; the script names now match the root
# `package.json` and `pnpm exec playwright test` replaces the missing `test:e2e`.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Security scans weekly
    - cron: '0 0 * * 0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    # services/api's vitest.config.ts loads .env / .env.test, but both are gitignored,
    # so the API suites abort at collection with "JWT_SECRET must be set to a strong
    # value" without these. All values are obviously-dummy test placeholders.
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://test:test@localhost:5432/test
      JWT_SECRET: ci-test-jwt-secret-not-a-real-key-0123456789
      JWT_REFRESH_TOKEN_SECRET: ci-test-refresh-token-not-a-real-key-0123456789
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-a-real-key-0123456789
      PORT: '3001'
      ANTHROPIC_API_KEY: sk-test-fake-key
      BROCODE_API_KEY: test-brocode-fake
      SARVAM_API_KEY: test-sarvam-fake
      DEEPGRAM_API_KEY: test-deepgram-fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          files: ./coverage/lcov.info

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # upload-sarif writes to the Security tab; without this the job fails with
    # "Resource not accessible by integration".
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Dependency audit across all workspaces. The gate is critical-severity,
      # production dependencies only: the two critical advisories in the tree
      # are the vitest test runner (GHSA-5xrq-8626-4rwp), which is never
      # shipped; a high-severity `drizzle-orm` advisory stays deferred until
      # the repository-layer migration lands, so `high` would fail the
      # pipeline on known-and-accepted findings instead of new ones.
      - run: pnpm audit --prod --audit-level=critical
      # SAST — Semgrep static analysis
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
      # Container image scanning with Trivy
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      # High-severity advisory reporting (was google/osv-scanner-action@v1 — that ref
      # is not published, so the job failed at action resolution). Advisory output is
      # informational only: the hard gate is `pnpm audit --audit-level=critical` above,
      # and `|| true` keeps transitive dev-dependency advisories from failing the job.
      - run: pnpm audit --audit-level=high || true
      # Upload SARIF results to GitHub Security tab
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports: ['5433:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nova_test
        options: >-
          --health-cmd "pg_isready -U postgres -d nova_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      # NOTE: no MinIO container. minio/minio (Docker Hub) and quay.io/minio/minio
      # both refuse anonymous pulls now, and the E2E specs (auth, conversations,
      # onboarding, dashboard, notifications) never touch object storage —
      # services/api creates its S3 client lazily (audio-storage.ts getClient),
      # so the server boots fine against the unreachable dummy endpoint below.
      # The compose files still reference minio/minio and will break on any host
      # without the image cached; that is a separate (infra) fix.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Install Playwright browsers and OS deps
      - run: pnpm exec playwright install --with-deps chromium
      # Wait for infra
      - run: sleep 5
      # Run migrations against the service containers
      - run: DATABASE_URL=postgres://postgres:postgres@localhost:5433/nova_test REDIS_URL=redis://localhost:6380 pnpm run db:migrate
      # Build the three services AND their @nova/* workspace dependencies. The
      # `dev` (tsx) entrypoints resolve workspace packages to their dist/
      # entrypoints, which do not exist on a fresh checkout — the admin boot
      # died in CI with "Cannot find module @nova/auth/dist/index.js" while
      # the bare wait loop silently let the job continue to failure.
      - run: pnpm --filter @nova/api... --filter @nova/auth... --filter @nova/admin... run build
      # Start the services in the background
      - run: |
          # JWT_SECRET must be ≥32 chars (services/api and services/auth refuse to
          # boot otherwise) and identical for all three services so tokens @nova/auth
          # signs are accepted by @nova/api and @nova/admin; services/auth reads the
          # refresh secret as JWT_REFRESH_SECRET, not REFRESH_TOKEN_SECRET.
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/nova_test REDIS_URL=redis://localhost:6380 S3_ENDPOINT=http://localhost:9001 S3_ACCESS_KEY=minioadmin S3_SECRET_KEY=minioadmin JWT_SECRET=e2e-ci-jwt-secret-not-a-real-key-0123456789abcdef PORT=3001 pnpm --filter @nova/api run dev &
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/nova_test REDIS_URL=redis://localhost:6380 JWT_SECRET=e2e-ci-jwt-secret-not-a-real-key-0123456789abcdef JWT_REFRESH_SECRET=e2e-ci-refresh-secret-not-a-real-key-0123456789abcdef AUTH_ENCRYPTION_KEY=e2lwZW50b2tlcmtleXdlbGx0aGluZzMyYnl0ZXNmb3J0ZXNl API_KEY_SECRET=e2e-api-key-secret-do-not-use-prod PORT=3003 pnpm --filter @nova/auth run dev &
          # @nova/admin is services/admin (the Express admin service the tests probe
          # on /health), NOT apps/admin (`nova-admin`, the Next.js console).
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/nova_test REDIS_URL=redis://localhost:6380 JWT_SECRET=e2e-ci-jwt-secret-not-a-real-key-0123456789abcdef PORT=3004 CORS_ORIGIN=http://localhost:3000 pnpm --filter @nova/admin run dev &
          # Wait for all three services instead of a bare sleep, which raced the
          # postgres health gate and the tsx startup. Fail the job if they never
          # come up — otherwise Playwright "fails" against dead ports and the
          # real boot error is lost.
          healthy=
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/healthz >/dev/null && curl -sf http://127.0.0.1:3003/health/live >/dev/null && curl -sf http://127.0.0.1:3004/health >/dev/null; then
              echo "all services healthy"; healthy=1; break
            fi
            sleep 2
          done
          [ -n "$healthy" ] || { echo "services never became healthy in 60s"; exit 1; }
      # Run E2E tests
      # 127.0.0.1, not localhost: on the runner `localhost` resolves to ::1
      # (IPv6) first and the services listen on IPv4, so Playwright's request
      # context got ECONNREFUSED ::1:3001 while curl's IPv4 fallback let the
      # boot-wait loop pass.
      - run: pnpm exec playwright test
        env:
          API_URL: http://127.0.0.1:3001
          AUTH_URL: http://127.0.0.1:3003
          ADMIN_URL: http://127.0.0.1:3004
      # Upload Playwright report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packages/*/dist/
            services/*/dist/
          retention-days: 7
