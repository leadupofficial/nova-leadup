name: Build Android APK
'on':
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  workflow_dispatch: null
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_UNSTABLE_DISABLE_DEV_LAUNCHER_AUTOLINKING: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Accept Android SDK licenses
      run: 'mkdir -p /usr/local/lib/android/sdk/licenses

        echo -e "\nd243215ed4a640bd90b24baca47b2e39\n\n84831b9409646a918e30573bab4c9c91\n\nd56f5187479451eabf01fb78af6dfcb6"
        > /usr/local/lib/android/sdk/licenses/android-sdk-license

        echo -e "\n84831b9409646a918e30573bab4c9c91\n\nd56f5187479451eabf01fb78af6dfcb6"
        > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license

        echo "Accepted licenses"

        '
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Create placeholder app assets
      working-directory: apps/mobile
      run: 'mkdir -p assets

        python3 -c "

        import struct, zlib

        def chunk(ctype, data):

        c = ctype + data

        return struct.pack(''>I'', len(data)) + c + struct.pack(''>I'', zlib.crc32(c)
        & 0xffffffff)

        ihdr = struct.pack(''>IIBBBBB'', 1, 1, 8, 6, 0, 0, 0)

        raw = b''\x00'' * 5

        idat = zlib.compress(raw)

        png = b''\x89PNG\r\n\x1a\n'' + chunk(b''IHDR'', ihdr) + chunk(b''IDAT'', idat)
        + chunk(b''IEND'', b'''')

        with open(''assets/icon.png'', ''wb'') as f: f.write(png)

        "

        cp assets/icon.png assets/adaptive-icon.png

        cp assets/icon.png assets/splash.png

        echo "Created valid placeholder assets"

        '
    - name: Generate native Android project
      working-directory: apps/mobile
      env:
        EXPO_UNSTABLE_DISABLE_DEV_LAUNCHER_AUTOLINKING: '1'
      run: 'npx expo prebuild --platform android --clean

        echo "Generated Android project"'
    - name: Fix Gradle root project plugin
      working-directory: apps/mobile/android
      run: 'sed -i.bak ''/com.facebook.react.rootproject/d'' build.gradle

        echo ''Removed rootproject plugin'''
    - name: Build release APK
      working-directory: apps/mobile/android
      run: 'chmod +x gradlew

        ./gradlew assembleRelease --no-daemon

        echo "Built APK"'
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: nova-android-apk
        path: apps/mobile/android/app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: error
    - name: APK Info
      run: 'APK_SIZE=$(find apps/mobile/android/app/build/outputs/apk/release -name
        "*.apk" -exec ls -lh {} \; | awk ''{print $5}'')\necho "APK built successfully!"\necho
        "Size: $APK_SIZE"'
