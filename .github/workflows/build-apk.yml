name: Build Android APK
'on':
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  workflow_dispatch: null
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Verify pnpm
      run: pnpm --version
    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Generate native Android project
      working-directory: apps/mobile
      run: 'npx expo prebuild --platform android --clean

        echo "Generated Android project"'
    - name: Build release APK
      working-directory: apps/mobile/android
      run: 'chmod +x gradlew

        ./gradlew assembleRelease --no-daemon

        echo "Built APK"'
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: nova-android-apk
        path: apps/mobile/android/app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: error
    - name: APK Info
      run: 'APK_SIZE=$(find apps/mobile/android/app/build/outputs/apk/release -name
        "*.apk" -exec ls -lh {} \; | awk ''{print $5}'')

        echo "APK built successfully!"

        echo "Size: $APK_SIZE"'
