name: Build Android APK

# Produces installable Flutter APKs for the NOVA mobile app.
#
#   - pull request  -> unsigned debug APK (fast smoke artifact)
#   - push / manual -> signed release APK
#
# This workflow used to be an Expo/React Native pipeline: it installed Node, Expo and
# pnpm, ran `npm test` / `npx expo lint`, and then invoked `./gradlew assembleRelease`
# directly inside apps/mobile/android. That last step cannot work any more, because
# apps/mobile/android is now a Flutter Android project: `settings.gradle.kts` requires
# `flutter.sdk` from local.properties and the Flutter Gradle plugin, neither of which
# exists when Gradle is called without the Flutter tool. It also never installed a
# Flutter SDK, and it wrote `app/signing.properties` with MYAPP_RELEASE_* keys, which
# the current build reads as keystore.properties / ANDROID_* environment variables.
#
# Lint and unit tests run in `.github/workflows/android.yml`; this workflow owns
# build artifacts only.
#
# Release signing secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the release .jks   (required for release)
#   ANDROID_KEYSTORE_PASSWORD keystore password            (required for release)
#   ANDROID_KEY_ALIAS         key alias, defaults to "nova"
#   ANDROID_KEY_PASSWORD      key password, defaults to ANDROID_KEYSTORE_PASSWORD
#
# `android/app/build.gradle.kts` reads these ANDROID_* environment variables directly,
# so no keystore.properties file is needed in CI. A release build with missing values
# fails loudly with an explicit list of what is absent.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: Artifact to build
        type: choice
        options: [release, debug]
        default: release

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'nova' }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
      API_URL: ${{ vars.NOVA_API_URL || 'https://api.nova.leadup.tech' }}
    steps:
      - uses: actions/checkout@v4

      # The app's pubspec requires Dart ^3.13.2, which is newer than the Dart shipped
      # with Flutter stable 3.29. Verified against Flutter 3.48.0-0.4.pre / Dart 3.14.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve build type
        id: mode
        run: |
          mode="${{ github.event.inputs.build_type || 'release' }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mode=debug
          elif [ "$mode" = "release" ] && [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            # Without signing secrets a signed release is impossible; fall back to an
            # unsigned debug APK so the pipeline still produces a usable artifact
            # instead of failing.
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; building an unsigned debug APK instead of a signed release."
            mode=debug
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: steps.mode.outputs.mode == 'release'
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set, so a signed release APK cannot be produced."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/nova-release.jks
          # Read by the signingConfigs block in android/app/build.gradle.kts.
          echo "ANDROID_KEYSTORE_PATH=nova-release.jks" >> "$GITHUB_ENV"
          echo "Decoded release keystore"

      - name: Build ${{ steps.mode.outputs.mode }} APK
        run: |
          flutter build apk \
            --${{ steps.mode.outputs.mode }} \
            --target-platform android-arm64 \
            --dart-define=API_URL="$API_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-android-${{ steps.mode.outputs.mode }}-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      # Needed to symbolicate obfuscated release crash reports.
      - name: Upload R8 mapping
        if: steps.mode.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: nova-mapping-${{ github.sha }}
          path: apps/mobile/build/app/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn
