 - Admin Policy
 summary: List admin policy rules
 security:
 - bearerAuth: []
 responses:
 '200':
 description: Policy rules list
 content:
 application/json:
 schema:
 type: array
 items:
 $ref: '#/components/schemas/PolicyRule'

 post:
 tags:
 - Admin Policy
 summary: Create a policy rule
 security:
 - bearerAuth: []
 requestBody:
 required: true
 content:
 application/json:
 schema:
 $ref: '#/components/schemas/CreatePolicyRule'
 responses:
 '201':
 description: Policy rule created
 content:
 application/json:
 schema:
 $ref: '#/components/schemas/PolicyRule'

 patch:
 tags:
 - Admin Policy
 summary: Update a policy rule
 security:
 - bearerAuth: []
 parameters:
 - name: id
 in: path
 required: true
 schema:
 type: string
 format: uuid
 requestBody:
 required: true
 content:
