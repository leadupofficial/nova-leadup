 $ref: '#/components/responses/NotFound'

 /admin/health:
 get:
 tags:
 - Observability
 summary: Full system health check
 security:
 - bearerAuth: []
 responses:
 '200':
 description: Full health status
 content:
 application/json:
 schema:
 type: object
 properties:
 status:
 type: string
 timestamp:
 type: string
 format: date-time
 dependencies:
 type: object
 checks:
 type: array
 items:
 type: object

 /admin/health/checks:
 post:
 tags:
 - Observability
 summary: Update a health check (service-to-service)
 security:
 - bearerAuth: []
 requestBody:
 required: true
 content:
 application/json:
 schema:
 $ref: '#/components/schemas/UpdateHealthCheck'
 responses:
 '200':
 description: Health check updated

components:
 securitySchemes:
 bearerAuth:
 type: http
 scheme: bearer
 bearerFormat: JWT

 schemas:
 HealthResponse:
 type: object
 properties:
 status:
 type: string
 enum: [healthy, degraded, unhealthy]
 timestamp:
 type: string
 format: date-time
 version:
 type: string
 dependencies:
 type: object
 properties:
 database:
 $ref: '#/components/schemas/DependencyCheck'
 redis:
 $ref: '#/components/schemas/DependencyCheck'
 storage:
 $ref: '#/components/schemas/DependencyCheck'

 DependencyCheck:
 type: object
 properties:
 status:
 type: string
 enum: [up, down]
 latencyMs:
 type: number

 Organization:
 type: object
 properties:
 id:
 type: string
 format: uuid
 name:
 type: string
 slug:
 type: string
 plan:
 type: string
 created_at:
 type: string
 format: date-time

 PaginatedOrganizations:
 type: object
 properties:
 data:
 type: array
 items:
 $ref: '#/components/schemas/Organization'
 page:
 type: integer
 pageSize:
 type: integer
 totalItems:
 type: integer
 totalPages:
 type: integer

 UpdateOrganization:
 type: object
 properties:
 name:
 type: string
 maxLength: 255
 plan:
 type: string
 enum: [free, pro, enterprise]

 PaginatedUsers:
 type: object
 properties:
 data:
 type: array
 items:
 type: object
 properties:
 id:
 type: string
 format: uuid
 email:
 type: string
 display_name:
 type: string
 role:
 type: string
 created_at:
 type: string
 format: date-time
 page:
 type: integer
 pageSize:
 type: integer
 totalItems:
 type: integer
 totalPages:
 type: integer

 ChangeUserRole:
 type: object
 required:
 - role
 properties:
 role:
 type: string
 enum: [owner, admin, manager, member, auditor, support_limited]

 Workspace:
 type: object
 properties:
 id:
 type: string
 format: uuid
 name:
 type: string
 organization_id:
 type: string
 format: uuid
 created_at:
 type: string
 format: date-time

 CreateWorkspace:
 type: object
 required:
 - name
 properties:
 name:
 type: string
 maxLength: 255

 UpdateWorkspace:
 type: object
 properties:
 name:
 type: string
 maxLength: 255

 Role:
 type: object
 properties:
 id:
 type: string
 format: uuid
 key:
 type: string
 display_name:
 type: string
 description:
 type: string

 CreateAuditEvent:
 type: object
 required:
 - action
 properties:
 action:
 type: string
 maxLength: 100
 resource_type:
 type: string
 maxLength: 50
 resource_id:
 type: string
 format: uuid
 changes:
 type: object
 additionalProperties: true
 tool_name:
 type: string
 maxLength: 100
 tool_input:
 type: object
 additionalProperties: true
 tool_output:
 type: object
 additionalProperties: true
 decision:
 type: string
 enum: [allowed, denied, escalated]
 request_id:
 type: string
 maxLength: 64
 actor_session_id:
 type: string
 format: uuid
 actor_device_id:
 type: string
 format: uuid
 correlation_id:
 type: string
 maxLength: 64
 ip_address:
 type: string
 user_agent:
 type: string

 PaginatedAuditEvents:
 type: object
 properties:
 data:
 type: array
 items:
 $ref: '#/components/schemas/AuditEvent'
 page:
 type: integer
 pageSize:
 type: integer
 totalItems:
 type: integer
 totalPages:
 type: integer

 AuditEvent:
 type: object
 properties:
 id:
 type: string
 format: uuid
 organization_id:
 type: string
 format: uuid
 actor_user_id:
 type: string
 format: uuid
 action:
 type: string
 resource_type:
 type: string
 resource_id:
 type: string
 format: uuid
 changes:
 type: object
 additionalProperties: true
 ip_address:
 type: string
 user_agent:
 type: string
 request_id:
 type: string
 tool_name:
 type: string
 tool_input:
 type: object
 additionalProperties: true
 tool_output:
 type: object
 additionalProperties: true
 decision:
 type: string
 correlation_id:
 type: string
 created_at:
 type: string
 format: date-time

 AuditStats:
 type: object
 properties:
 totalEvents:
 type: integer
 actionCounts:
 type: object
 additionalProperties:
 type: integer
 toolCounts:
 type: object
 additionalProperties:
 type: integer
 decisions:
 type: object
 additionalProperties:
 type: integer

 FeatureFlag:
 type: object
 properties:
 id:
 type: string
 format: uuid
 key:
 type: string
 description:
 type: string
 enabled:
 type: boolean
 rollout_percentage:
 type: integer
 allowed_org_ids:
 type: array
 items:
 type: string
 format: uuid
 allowed_user_ids:
 type: array
 items:
 type: string
 format: uuid
 metadata:
 type: object
 additionalProperties: true
 created_at:
 type: string
 format: date-time
 updated_at:
 type: string
 format: date-time

 UpdateFeatureFlag:
 type: object
 properties:
 enabled:
 type: boolean
 rollout_percentage:
 type: integer
 minimum: 0
 maximum: 100
 allowed_org_ids:
 type: array
 items:
 type: string
 format: uuid
 allowed_user_ids:
 type: array
 items:
 type: string
 format: uuid
 metadata:
 type: object
 additionalProperties: true

 UpdateHealthCheck:
 type: object
 required:
 - check_name
 - status
 properties:
 check_name:
 type: string
 category:
 type: string
 status:
 type: string
 enum: [healthy, degraded, unhealthy]
 latency_ms:
 type: integer
 minimum: 0
 message:
 type: string

 CreateIncident:
 type: object
 required:
 - severity
 - category
 - title
 properties:
 severity:
 type: string
 enum: [info, warning, error, critical]
 category:
 type: string
 maxLength: 50
 title:
 type: string
 maxLength: 255
 description:
 type: string
 source:
 type: string
 maxLength: 100
 metadata:
 type: object
 additionalProperties: true

 IncidentEvent:
 type: object
 properties:
 id:
 type: string
 format: uuid
 organization_id:
 type: string
 format: uuid
 severity:
 type: string
 category:
 type: string
 title:
 type: string
 description:
 type: string
 source:
 type: string
 metadata:
 type: object
 additionalProperties: true
 acknowledged_at:
 type: string
 format: date-time
 acknowledged_by:
 type: string
 format: uuid
 resolved_at:
 type: string
 format: date-time
 resolved_by:
 type: string
 format: uuid
 created_at:
 type: string
 format: date-time

 CreatePolicyRule:
 type: object
 required:
 - name
 properties:
 name:
 type: string
 maxLength: 255
 description:
 type: string
 rule_type:
 type: string
 maxLength: 50
 default: custom
 priority:
 type: integer
 default: 0
 condition:
 type: object
 additionalProperties: true
 default: {}
 action:
 type: object
 additionalProperties: true
 default: {}

 UpdatePolicyRule:
 type: object
 properties:
 name:
 type: string
 maxLength: 255
 description:
 type: string
 priority:
 type: integer
 condition:
 type: object
 additionalProperties: true
 action:
 type: object
 additionalProperties: true
 enabled:
 type: boolean

 PolicyRule:
 type: object
 properties:
 id:
 type: string
 format: uuid
 organization_id:
 type: string
 format: uuid
 name:
 type: string
 description:
 type: string
 rule_type:
 type: string
 priority:
 type: integer
 condition:
 type: object
 additionalProperties: true
 action:
 type: object
 additionalProperties: true
 enabled:
 type: boolean
 created_at:
 type: string
 format: date-time

responses:
 Unauthorized:
 description: Missing or invalid JWT
 content:
 application/json:
 schema:
 type: object
 properties:
 type:
 type: string
 example: https://api.nova.leadup.in/problems/unauthorized
 title:
 type: string
 example: Unauthorized
 status:
 type: integer
 example: 401
 detail:
 type: string

 Forbidden:
 description: Insufficient permissions
 content:
 application/json:
 schema:
 type: object
 properties:
 type:
 type: string
 example: https://api.nova.leadup.in/problems/forbidden
 title:
 type: string
 example: Forbidden
 status:
 type: integer
 example: 403
 detail:
 type: string

 NotFound:
 description: Resource not found
 content:
 application/json:
 schema:
 type: object
 properties:
 type:
 type: string
 example: about:blank
 title:
 type: string
 example: Not Found
 status:
 type: integer
 example: 404
 detail:
 type: string
