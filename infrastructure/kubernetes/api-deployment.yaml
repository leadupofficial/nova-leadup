# NOVA Leadup — Kubernetes API Deployment
#
# Re-indented: the original had every key at one space, so the pod template, container
# ports, probes and volumes were all flat siblings and the file was not valid YAML.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-api
  namespace: nova
  labels:
    app: nova-api
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: nova
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nova-api
  template:
    metadata:
      labels:
        app: nova-api
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: nova
        app.kubernetes.io/version: "0.1.0"
    spec:
      containers:
        - name: api
          image: ghcr.io/leadup-technologies/nova-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: nova-config
            - secretRef:
                name: nova-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets
          secret:
            secretName: nova-secrets
            defaultMode: 0400
