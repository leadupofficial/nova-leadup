# NOVA Leadup — Kubernetes Redis Deployment
#
# Re-indented. This one parsed as YAML by accident, which made it worse than the files
# that failed: every key sat at one space, so `spec.template` was empty, `selector`
# was null, and duplicate keys (`app`, `spec`, `name`, `ports`, `resources`, …)
# silently overwrote each other. The pod template, ports, probes and volumes below are
# what the flattened text was trying to express.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nova-redis-pvc
  namespace: nova
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-redis
  namespace: nova
  labels:
    app: nova-redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: nova
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nova-redis
  template:
    metadata:
      labels:
        app: nova-redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: nova
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nova-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: nova-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nova-redis
  namespace: nova
  labels:
    app: nova-redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: nova
spec:
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: nova-redis
  type: ClusterIP
