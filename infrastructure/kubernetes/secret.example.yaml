# NOVA Leadup — Kubernetes Secrets Template
# Copy this file to secret.yaml and fill in real values.
# Never commit secret.yaml to version control.
#
# Re-indented for consistency with the other manifests. This one happened to parse
# correctly, because every key under `stringData` was a flat sibling.
apiVersion: v1
kind: Secret
metadata:
  name: nova-secrets
  namespace: nova
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgres://nova:<CHANGE_ME>@nova-postgres:5432/nova"
  REDIS_URL: "redis://:<CHANGE_ME>@nova-redis:6379"
  REDIS_PASSWORD: "<CHANGE_ME>"

  # JWT — generate with: openssl rand -base64 64
  JWT_SECRET: "<CHANGE_ME>"
  JWT_REFRESH_SECRET: "<CHANGE_ME>"

  # Encryption
  API_KEY_SECRET: "<CHANGE_ME>"
  AUTH_ENCRYPTION_KEY: "<CHANGE_ME>"

  # AI Provider Keys
  ANTHROPIC_API_KEY: "<CHANGE_ME>"
  OPENAI_API_KEY: "<CHANGE_ME>"
  DEEPGRAM_API_KEY: "<CHANGE_ME>"
  ELEVENLABS_API_KEY: "<CHANGE_ME>"
  SARVAM_API_KEY: "<CHANGE_ME>"

  # S3 / MinIO
  S3_ACCESS_KEY: "<CHANGE_ME>"
  S3_SECRET_KEY: "<CHANGE_ME>"
