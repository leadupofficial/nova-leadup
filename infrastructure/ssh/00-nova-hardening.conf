# NOVA SSH hardening — install as /etc/ssh/sshd_config.d/00-nova-hardening.conf
#
# WHY THIS EXISTS
#
# On 2026-09-19 the production server was found with `PermitRootLogin yes`,
# `PasswordAuthentication yes`, no fail2ban, and **63,475 failed root password
# attempts in seven days** (~9,000/day). Root already had two authorised keys and
# key authentication was verified working, so accepting passwords bought nothing
# and exposed everything — the more so because the root password was stored in
# plaintext on a developer machine.
#
# THE FILENAME MATTERS
#
# sshd uses the FIRST value it sees for a keyword, and processes
# /etc/ssh/sshd_config.d/*.conf in lexical order at the point of the Include
# (line 12 here). The image ships `50-cloud-init.conf` containing
# `PasswordAuthentication yes`. A drop-in named 99-*.conf therefore lost to it —
# which is exactly what happened on the first attempt: the config was applied,
# reloaded, and reported `passwordauthentication yes`. Naming this file 00-
# makes it win.
#
# Verify after installing with:  sshd -T | grep -E 'passwordauth|permitrootlogin'
# Then prove both directions: key auth must still work, and password auth must be
# refused. Do not reload sshd without validating with `sshd -t` first — and use
# reload, not restart, so an existing session survives a mistake.

PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Slow down anything that still tries.
MaxAuthTries 3
LoginGraceTime 20
