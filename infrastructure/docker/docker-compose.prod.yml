# Production Docker Compose override
# Usage: docker compose -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.prod.yml up -d

services:
 postgres:
 restart: always
 environment:
 POSTGRES_USER: ${POSTGRES_USER:-nova}
 POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
 POSTGRES_DB: ${POSTGRES_DB:-nova}
 volumes:
 - pgdata:/var/lib/postgresql/data
 - ./init-scripts:/docker-entrypoint-initdb.d:ro
 networks:
 - nova-internal
 deploy:
 resources:
 limits:
 cpus: '2'
 memory: 2G
 healthcheck:
 test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova}"]
 interval: 5s
 timeout: 3s
 retries: 5

 redis:
 restart: always
 command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --maxmemory 256mb --maxmemory-policy allkeys-lru
 volumes:
 - redisdata:/data
 networks:
 - nova-internal
 deploy:
 resources:
 limits:
 cpus: '0.5'
 memory: 256M
 healthcheck:
 test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
 interval: 5s
 timeout: 3s
 retries: 5

 api:
 build:
 context: ..
 dockerfile: infrastructure/docker/Dockerfile
 restart: always
 ports:
 - "127.0.0.1:3000:3000"
 environment:
 DATABASE_URL: ${DATABASE_URL}
 REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
 JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
 ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set}
 ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
 SARVAM_API_KEY: ${SARVAM_API_KEY}
 S3_ENDPOINT: ${S3_ENDPOINT}
 S3_ACCESS_KEY: ${S3_ACCESS_KEY}
 S3_SECRET_KEY: ${S3_SECRET_KEY}
 S3_BUCKET: ${S3_BUCKET}
 CORS_ORIGIN: ${CORS_ORIGIN:-https://nova.leadup.in}
 NODE_ENV: production
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 volumes:
 - ./secrets:/run/secrets:ro
 networks:
 - nova-internal
 deploy:
 replicas: 2
 resources:
 limits:
 cpus: '2'
 memory: 1G
 healthcheck:
 test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
 interval: 10s
 timeout: 5s
 retries: 5

 realtime-gateway:
 build:
 context: ..
 dockerfile: infrastructure/docker/Dockerfile
 target: realtime-gateway
 restart: always
 ports:
 - "127.0.0.1:3002:3002"
 environment:
 DATABASE_URL: ${DATABASE_URL}
 REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
 NODE_ENV: production
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 networks:
 - nova-internal
 deploy:
 resources:
 limits:
 cpus: '0.5'
 memory: 256M
 healthcheck:
 test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
 interval: 10s
 timeout: 5s
 retries: 3

 worker:
 build:
 context: ..
 dockerfile: infrastructure/docker/Dockerfile
 target: worker
 restart: always
 environment:
 DATABASE_URL: ${DATABASE_URL}
 REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
 S3_ENDPOINT: ${S3_ENDPOINT}
 S3_BUCKET: ${S3_BUCKET}
 NODE_ENV: production
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 networks:
 - nova-internal
 deploy:
 resources:
 limits:
 cpus: '1'
 memory: 512M

 minio:
 restart: always
 environment:
 MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
 MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
 volumes:
 - miniodata:/data
 networks:
 - nova-internal
 deploy:
 resources:
 limits:
 cpus: '0.5'
 memory: 512M
 healthcheck:
 test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
 interval: 5s
 timeout: 3s
 retries: 5

 nginx:
 image: nginx:1.27-alpine
 container_name: nova-nginx
 restart: always
 ports:
 - "80:80"
 - "443:443"
 volumes:
 - ../deploy/web:/usr/share/nginx/html:ro
 - ../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
 - ../deploy/nginx/conf.d:/etc/nginx/conf.d:ro
 - nginx-logs:/var/log/nginx
 - /etc/letsencrypt:/etc/letsencrypt:ro
 depends_on:
 api:
 condition: service_healthy
 networks:
 - nova-internal
 - nova-public

volumes:
 pgdata:
 driver: local
 redisdata:
 driver: local
 miniodata:
 driver: local
 nginx-logs:
 driver: local

networks:
 nova-internal:
 driver: bridge
 internal: true
 nova-public:
 driver: bridge
