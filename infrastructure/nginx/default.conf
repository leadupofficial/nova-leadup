# NOVA Production — nginx Configuration
# Reverse proxy between ALB/Internet and Docker containers
# Provides TLS termination, rate limiting, security headers, and request routing

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
 worker_connections 1024;
}

http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;

 # Logging with upstream response time
 log_format main '$remote_addr - $remote_user [$time_local] "$request" '
 '$status $body_bytes_sent "$http_referer" '
 '"$http_user_agent" "$http_x_forwarded_for" '
 'rt=$request_time urt="$upstream_response_time"';

 access_log /var/log/nginx/access.log main;

 # Performance
 sendfile on;
 tcp_nopush on;
 tcp_nodelay on;
 keepalive_timeout 65;
 types_hash_max_size 2048;
 server_tokens off;

 # Gzip compression
 gzip on;
 gzip_vary on;
 gzip_min_length 1024;
 gzip_types text/plain text/css text/xml text/javascript
 application/x-javascript application/xml+rss
 application/json application/javascript;

 # Security headers
 add_header X-Frame-Options "DENY" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-XSS-Protection "1; mode=block" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;

 # Rate limiting zones
 limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
 limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
 limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;

 # =============================================
 # Upstream definitions (Docker container ports)
 # =============================================
 upstream api_backend {
 server 127.0.0.1:3001;
 keepalive 32;
}

 upstream auth_backend {
 server 127.0.0.1:3003;
 keepalive 32;
}

 upstream admin_backend {
 server 127.0.0.1:3004;
 keepalive 32;
}

 # =============================================
 # HTTP server — redirect to HTTPS
 # =============================================
 server {
 listen 80;
 listen [::]:80;
 server_name nova.leadup.in api.nova.leadup.in auth.nova.leadup.in admin.nova.leadup.in;

 # ACME challenge for Let's Encrypt
 location ^~ /.well-known/acme-challenge/ {
 root /var/www/letsencrypt;
}

 # Everything else redirects to HTTPS
 location / {
 return 301 https://$host$request_uri;
}
}

 # =============================================
 # HTTPS server — reverse proxy to Docker containers
 # =============================================
 server {
 listen 443 ssl http2;
 listen [::]:443 ssl http2;
 server_name nova.leadup.in;

 # TLS configuration
 ssl_certificate /etc/letsencrypt/live/nova.leadup.in/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/nova.leadup.in/privkey.pem;
 ssl_session_timeout 1d;
 ssl_session_cache shared:SSL:50m;
 ssl_session_tickets off;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
 ssl_prefer_server_ciphers off;
 ssl_stapling on;
 ssl_stapling_verify on;
 resolver 8.8.8.8 8.8.4.4 valid=300s;

 # HSTS header
 add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

 client_max_body_size 50M;

 # Health check (direct response, no upstream)
 location = /health/live {
 access_log off;
 add_header Content-Type application/json;
 return 200 '{"status":"ok","service":"nginx"}';
}

 # Health check — ready (checks upstream)
 location = /health/ready {
 access_log off;
 proxy_pass http://api_backend/health/ready;
 proxy_connect_timeout 2s;
}

 # API routes — rate limited
 location /api/ {
 limit_req zone=api burst=20 nodelay;
 proxy_pass http://api_backend/;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header Connection "";
 proxy_connect_timeout 10s;
 proxy_send_timeout 30s;
 proxy_read_timeout 30s;
}

 # Auth routes
 location /auth/ {
 limit_req zone=auth burst=10 nodelay;
 proxy_pass http://auth_backend/;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header Connection "";
}

 # Login endpoint — strictest rate limiting
 location = /auth/login {
 limit_req zone=login burst=5 nodelay;
 proxy_pass http://auth_backend/login;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header Connection "";
}

 # Metrics — IP-restricted
 location /metrics/ {
 allow 127.0.0.1;
 allow 10.0.0.0/8;
 allow 172.16.0.0/12;
 allow 192.168.0.0/16;
 deny all;
 proxy_pass http://api_backend/metrics/;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
}

 # Admin routes — IP-restricted
 location /admin/ {
 allow 127.0.0.1;
 allow 10.0.0.0/8;
 allow 172.16.0.0/12;
 deny all;
 proxy_pass http://admin_backend/;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header Connection "";
}

 # Catch-all
 location / {
 return 301 /api/;
}
}

 # =============================================
 # Admin subdomain server block
 # =============================================
 server {
 listen 443 ssl http2;
 listen [::]:443 ssl http2;
 server_name admin.nova.leadup.in;

 ssl_certificate /etc/letsencrypt/live/nova.leadup.in/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/nova.leadup.in/privkey.pem;
 ssl_session_timeout 1d;
 ssl_session_cache shared:SSL:50m;
 ssl_protocols TLSv1.2 TLSv1.3;

 add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
 add_header X-Frame-Options "DENY" always;
 add_header X-Content-Type-Options "nosniff" always;

 client_max_body_size 50M;

 location / {
 allow 127.0.0.1;
 allow 10.0.0.0/8;
 allow 172.16.0.0/12;
 deny all;
 proxy_pass http://admin_backend/;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header Connection "";
}
}
}
